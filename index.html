<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pocket Factory</title>
<meta name="theme-color" content="#15181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Factory">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="readout">
    <div>
      <div class="label" id="rate-label">Gears delivered to hub</div>
      <div class="big"><span id="rate">0</span><small>/ <span id="target">30</span> per min</small></div>
    </div>
    <div class="side">
      <div id="chip" hidden><span class="chip">Target met</span></div>
      <div>Plates <span id="plates">0</span>/min</div>
      <div>Ore <span id="ores">0</span>/min</div>
    </div>
    <div class="bar" id="bar"><i id="barfill"></i></div>
  </header>

  <main class="floor" id="floor"><canvas id="cv" aria-label="Factory floor"></canvas></main>

  <div class="hint" id="hint" aria-live="polite"></div>

  <nav class="tray" aria-label="Build tools">
    <button class="tool on" data-tool="belt" id="t-belt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6-5 6 5M6 15l6-5 6 5M6 21l6-5 6 5"/></svg>Belt</button>
    <button class="tool" data-tool="miner" id="t-miner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 16l4-9 4 9z" fill="currentColor"/></svg>Miner</button>
    <button class="tool" data-tool="furnace" id="t-furnace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="13" r="4" fill="currentColor"/></svg>Furnace</button>
    <button class="tool" data-tool="assembler" id="t-assembler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="3.5"/><path d="M12 6v2.5M12 15.5V18M6 12h2.5M15.5 12H18"/></svg>Assemble</button>
    <button class="tool" data-tool="erase" id="t-erase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Remove</button>
  </nav>
  <div class="acts">
    <button class="act" id="undo">Undo</button>
    <button class="act" id="pause">Pause</button>
    <button class="act" id="clear">Clear floor</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
